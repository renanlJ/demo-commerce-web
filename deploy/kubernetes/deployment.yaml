apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-commerce-web
  labels:
    app: demo-commerce-web
    system: demo-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-commerce-web
  template:
    metadata:
      labels:
        app: demo-commerce-web
        system: demo-commerce
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Rendered nginx site config (entrypoint writes it) + writable
        # nginx runtime dirs — required for readOnlyRootFilesystem.
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      containers:
        - name: web
          image: ghcr.io/renanlj/demo-commerce-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: demo-commerce-web
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
